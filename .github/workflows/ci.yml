name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Report interpreter
        run: python -VV

      - name: Report filesystem (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          printf 'runner_os=%s\n' "$RUNNER_OS"
          stat -f -c 'workspace_filesystem=%T' "$GITHUB_WORKSPACE"
          stat -f -c 'runner_temp_filesystem=%T' "$RUNNER_TEMP"

      - name: Report filesystem (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          printf 'runner_os=%s\n' "$RUNNER_OS"
          stat -f 'workspace_filesystem=%T' "$GITHUB_WORKSPACE"
          stat -f 'runner_temp_filesystem=%T' "$RUNNER_TEMP"

      - name: Report filesystem (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $workspace = (Resolve-Path $env:GITHUB_WORKSPACE).Path
          $root = [System.IO.Path]::GetPathRoot($workspace)
          $drive = [System.IO.DriveInfo]::new($root)
          $tempRoot = [System.IO.Path]::GetPathRoot($env:RUNNER_TEMP)
          $tempDrive = [System.IO.DriveInfo]::new($tempRoot)
          "runner_os=$env:RUNNER_OS"
          "workspace_root=$root"
          "workspace_filesystem=$($drive.DriveFormat)"
          "runner_temp_root=$tempRoot"
          "runner_temp_filesystem=$($tempDrive.DriveFormat)"

      - name: Byte-compile scripts and tests
        shell: bash
        run: |
          pycache="$(mktemp -d)"
          if ! PYTHONPYCACHEPREFIX="$pycache" python -m compileall -q scripts tests; then
            rm -rf "$pycache"
            exit 1
          fi
          rm -rf "$pycache"

      - name: Standard-library test suite
        run: python -B -m unittest discover -s tests -v

      - name: Isolated-interpreter CLI smoke
        run: |
          python -B -I -S scripts/compress_claude_jsonl.py --version
          python -B -I -S scripts/repair_claude_jsonl.py --version

  package:
    name: npm package checks (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: npm test
        run: npm test --ignore-scripts

      - name: Inspect tarball contents
        run: npm pack --dry-run --json --ignore-scripts

      # A fork pull request must never run this repository's lifecycle scripts.
      # package.json declares none today, so --ignore-scripts changes nothing
      # observable; it keeps that a property of the workflow rather than an
      # accident of the current manifest.
      - name: Publish dry run
        run: npm publish --dry-run --access public --tag latest --ignore-scripts
